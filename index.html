<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>婚前默契问卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
/* 布局思路：单栏纸面式问卷，一页一个话题；结果页先给总览，再逐项展开。
   甲方=蓝(series 1)，乙方=橙(series 2)，其余全部用墨色，避免颜色抢戏。 */
:root{
  color-scheme:light;
  --bg:#f4f4f1; --surface:#fcfcfb; --ink:#151514; --ink2:#52514e; --muted:#6b6a66; --line:#e2e1dc;
  --a:#2a78d6; --b:#eb6834;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#9a998f; --line:#333330;
    --a:#3987e5; --b:#d95926;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#9a998f; --line:#333330;
  --a:#3987e5; --b:#d95926;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:.02em}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.lead{color:var(--ink2);margin-top:12px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.06em}

button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:8px;font-weight:500;min-height:44px}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--ink)}
.mode b{font-size:17px}
.mode span{color:var(--ink2);font-size:14px;line-height:1.6}
.mode em{font-style:normal;font-size:12px;color:var(--muted)}
@media (max-width:520px){.modes{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:6px}
.field label{display:flex;align-items:center;gap:8px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.a{background:var(--a)} .dot.b{background:var(--b)}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}

.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:0 2px 2px 0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.item{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.item legend{padding:0;font-size:16px;line-height:1.65;margin-bottom:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:4px 2px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.3;color:var(--ink2);background:var(--surface)}
.opt:hover span{border-color:var(--ink)}
.opt input:checked + span{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:500}
.opt input:focus-visible + span{outline:2px solid var(--ink);outline-offset:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted)}

/* results */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tile .who{display:flex;align-items:center;gap:8px;font-weight:500}
.tile .big{font-family:var(--font-display);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .big small{font-size:15px;color:var(--muted);font-family:var(--font-body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.dom{padding:14px 0;border-top:1px solid var(--line)}
.dom:first-of-type{border-top:0}
.dom header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:6.5em 1fr 2.4em;align-items:center;gap:8px;font-size:13px}
.barrow.solo{grid-template-columns:1fr 2.4em}
.barrow .nm{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow b{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.track{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:visible}
.track::before,.track::after{content:"";position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.45}
.track::before{left:50%} .track::after{left:75%}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px 5px 5px 5px;min-width:3px}
.fill:hover,.fill:focus-visible{filter:brightness(1.12)}
details{margin-top:8px}
summary{cursor:pointer;font-size:14px;color:var(--ink2)}
details ul{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:14px}
details li{margin-top:4px}
.prio{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.prio:first-of-type{border-top:0;padding-top:0}
.prio p.why{font-size:14px;color:var(--muted)}
.prio ul{margin:2px 0 0;padding-left:20px;color:var(--ink2);font-size:15px}
.diff{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.diff:first-of-type{border-top:0;padding-top:0}
.diff .ans{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.diff .ans span{display:inline-flex;align-items:center;gap:6px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;padding:4px 8px;border-radius:6px;opacity:0;transition:opacity .08s;white-space:nowrap}
textarea{width:100%;min-height:140px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="tip" role="status"></div>

<script>
(function(){
"use strict";

var SCALE=["很不同意","不同意","一般","同意","很同意"];

/* r:true 表示反向题（得分 = 6 − 选择） */
var DOMAINS=[
{id:"expect",name:"对婚姻的期待",desc:"你心里的婚姻是什么样的？",items:[
 {t:"我对婚后日常生活的样子，有比较具体而现实的想象。"},
 {t:"我明白结婚后感情也需要用心经营，不会自动保持。"},
 {t:"我觉得只要相爱，其他问题结婚后自然会解决。",r:true}],
 talk:["你想象中，婚后第一年的一个普通周末是怎么过的？各自说出来，看看画面一不一样。","有没有哪件事，你默认“结婚后就会好”，但现在其实还没解决？"]},
{id:"trait",name:"性格与习惯",desc:"接受对方原本的样子，也接受会有磨合。",items:[
 {t:"我能接受对方的性格，包括那些不太完美的部分。"},
 {t:"对方的生活习惯（比如整洁、作息、花钱方式），我觉得可以慢慢磨合。"},
 {t:"对方有些性格特点，让我对婚后长期相处有些担心。",r:true}],
 talk:["对方有哪个习惯，你现在一直忍着没说？","你觉得自己哪个习惯，最可能让对方受不了？"]},
{id:"comm",name:"沟通",desc:"想说的话，能不能好好说出来、被听见。",items:[
 {t:"我可以坦诚说出真实想法和感受，不太担心被评判。"},
 {t:"对方通常会认真听我说，并理解我真正想表达的意思。"},
 {t:"有些重要的话题，我们一直在回避，从来没有认真谈过。",r:true}],
 talk:["有哪个话题你一直想谈，又不敢开口？","你难过的时候，希望对方怎么做？是陪着、听着，还是帮你想办法？"]},
{id:"conflict",name:"矛盾与冲突",desc:"有分歧很正常，关键是怎么处理。",items:[
 {t:"出现分歧时，我们能冷静讨论，而不是互相指责。"},
 {t:"吵完之后，我们通常能真正解决问题，而不是不了了之。"},
 {t:"一有矛盾，我们当中总有一个人习惯冷战或躲开。",r:true}],
 talk:["上一次吵架是因为什么？当时你们各自在想什么？","吵架时，哪句话或哪种举动最伤人？约定以后都避开。"]},
{id:"money",name:"金钱与经济",desc:"包括收入、负债，也包括彩礼、买房等具体安排。",items:[
 {t:"我们已经坦诚地谈过各自的收入、存款和负债情况。"},
 {t:"婚后怎么管钱，以及彩礼、嫁妆、买房买车等大额开支怎么安排，我们已经有共识。"},
 {t:"钱的问题是我们之间比较大的压力或分歧来源。",r:true}],
 talk:["各自对父母有没有经济上的责任或打算？","婚后单笔花多少钱以上需要先商量？谁来管日常账？"]},
{id:"roles",name:"家务与分工",desc:"谁做什么，是不是都觉得公平。",items:[
 {t:"我们对婚后家务和日常事务的分工，都觉得比较公平。"},
 {t:"我们都支持对方的事业发展，包括加班、出差，甚至换城市。"},
 {t:"对于谁该多承担家务和家庭责任，我们的看法差别很大。",r:true}],
 talk:["各自列出最不想做的三件家务，看看是不是同一批。","如果一方有更好的工作机会要换城市，你们打算怎么决定？"]},
{id:"parents",name:"双方父母与原生家庭",desc:"结婚不只是两个人的事，往往牵涉两个家。",items:[
 {t:"我和对方的父母相处得比较自在。"},
 {t:"婚后住在哪里、是否与父母同住、过年回哪一边等问题，我们已经有共识。"},
 {t:"父母对我们关系的意见或干涉，常常给我们带来压力。",r:true}],
 talk:["你的父母对你们结婚最在意的是什么？","当你的父母和对方意见冲突时，你会怎么做？你希望对方怎么做？"]},
{id:"social",name:"朋友与社交",desc:"各自的朋友圈、聚会、异性朋友等。",items:[
 {t:"我喜欢对方的朋友，也愿意和他们相处。"},
 {t:"对方能接受我与朋友、同事来往的方式。"},
 {t:"我们经常因为各自的朋友或社交安排产生矛盾。",r:true}],
 talk:["你们能接受对方多久和朋友聚一次、几点前回家？","有没有哪段朋友关系（包括异性朋友），让你有点不舒服？"]},
{id:"kids",name:"孩子与生育",desc:"要不要、什么时候要、谁来带。",items:[
 {t:"我们对要不要孩子、什么时候要，看法一致。"},
 {t:"孩子怎么带、谁来带（自己带、老人帮忙、请人），我们有基本共识。"},
 {t:"在生育或养育孩子的问题上，我们之间存在比较大的分歧。",r:true}],
 talk:["你理想中的孩子数量和时间点是什么？如果迟迟没有、或者不能生育呢？","在孩子的教育上，你最看重的三件事是什么？"]},
{id:"intimacy",name:"亲密与相处",desc:"情感上的亲近，也包括身体上的亲密。可以只凭感觉作答。",items:[
 {t:"我对目前亲密方面的相处（情感上的亲近和身体接触）感到满意。"},
 {t:"我们可以坦诚谈论彼此在亲密方面的需要和界限。"},
 {t:"在亲密方面，我们需求的差距让我感到困扰。",r:true}],
 talk:["什么样的方式，会让你觉得被爱、被重视？","有没有哪条界限，你希望对方知道并尊重？"]},
{id:"life",name:"日常生活方式",desc:"作息、消费、休闲，以及手机占用多少时间。",items:[
 {t:"我们对空闲时间怎么安排大体满意，既有共同活动，也有各自的空间。"},
 {t:"我们的作息、消费习惯等日常生活方式比较合拍。"},
 {t:"对方使用手机、游戏或短视频的方式，让我觉得被忽视或困扰。",r:true}],
 talk:["各自写下理想的周末，再对比一下。","有没有哪块“私人空间”你需要，但还没跟对方说过？"]},
{id:"values",name:"价值观与人生规划",desc:"未来五到十年，想去哪里、成为什么样的人。",items:[
 {t:"我们对未来五到十年的人生方向（事业、定居城市等）有共同的想法。"},
 {t:"在重要的价值观（比如对待金钱、家庭、诚信、人生意义）上，我们基本一致。"},
 {t:"在信仰、生活习俗或传统仪式（比如宗教、风水、祭祖）上，我们的差异让我担心。",r:true}],
 talk:["五年后，你希望自己和这段关系在哪里、是什么样子？","有没有哪件事，是你绝对不会让步的？"]}
];

var IDEAL={id:"ideal",name:"整体感受",desc:"最后几句，按第一感觉选，不用多想。",items:[
 {t:"我们之间从来没有出现过真正的矛盾。"},
 {t:"对方没有任何一点让我不满意。"},
 {t:"我们的关系比我认识的所有情侣都要好。"},
 {t:"我从来没有怀疑过我们该不该结婚。"},
 {t:"我们对所有事情的看法几乎完全一致。"}]};

var PAGES=DOMAINS.concat([IDEAL]);
var TOTAL_ITEMS=PAGES.reduce(function(s,p){return s+p.items.length;},0);

var state={mode:null,names:["甲方","乙方"],who:0,page:0,ans:[{},{}]};
var app=document.getElementById("app");
var tip=document.getElementById("tip");

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function top(){try{window.scrollTo(0,0);}catch(e){}}
function dotFor(i){return '<span class="dot '+(i===0?'a':'b')+'"></span>';}

/* ---------- screens ---------- */
function renderIntro(){
  app.innerHTML=
  '<div class="stack">'+
   '<div><p class="eyebrow">婚前情侣 · 约 10 分钟 · '+TOTAL_ITEMS+' 道题</p>'+
   '<h1 style="margin-top:8px">婚前默契问卷</h1>'+
   '<p class="lead">十二个话题，每个三句话，选出你的真实感受。结果不是打分排名，而是帮你们看清：哪些地方已经很默契，哪些话该先聊。</p></div>'+
   '<div class="modes">'+
    '<button class="mode" data-mode="couple"><em>推荐</em><b>两个人分别做</b><span>先后在同一台设备上作答，彼此看不到对方的选择，最后对比两人的看法。</span></button>'+
    '<button class="mode" data-mode="solo"><b>一个人先做</b><span>只看自己的结果，适合先自我梳理，再决定要不要拉着对方一起做。</span></button>'+
   '</div>'+
   '<div class="note">这份问卷是参考婚前评估的常见思路原创编写的，不是 PREPARE/ENRICH，也没有常模和信效度数据。它不是诊断，也不能预测你们会不会幸福，只用来帮助你们找到值得聊的话题。答案只保存在当前页面里，刷新或关闭后会丢失。</div>'+
  '</div>';
}

function renderSetup(){
  app.innerHTML=
  '<div class="stack">'+
   '<div><h2>先写下称呼</h2><p class="lead">结果页会用到。留空就用“甲方”“乙方”。</p></div>'+
   '<div class="sheet stack">'+
    '<div class="field"><label for="nameA">'+dotFor(0)+'先做的人</label><input type="text" id="nameA" maxlength="6" placeholder="甲方" autocomplete="off" value="'+(state.names[0]==="甲方"?"":esc(state.names[0]))+'"></div>'+
    '<div class="field"><label for="nameB">'+dotFor(1)+'后做的人</label><input type="text" id="nameB" maxlength="6" placeholder="乙方" autocomplete="off" value="'+(state.names[1]==="乙方"?"":esc(state.names[1]))+'"></div>'+
    '<p class="muted">请各自独立作答，不要商量着选。先做的人做完后，设备交给对方，对方看不到前一个人的答案。</p>'+
   '</div>'+
   '<div class="row"><button class="btn ghost" data-act="home">返回</button><button class="btn" data-act="start">开始作答</button></div>'+
  '</div>';
}

function renderQuiz(){
  var p=PAGES[state.page], a=state.ans[state.who];
  var done=answeredOnPage();
  var isLast=state.page===PAGES.length-1;
  var who=state.mode==="couple"?'<span class="chip">'+dotFor(state.who)+esc(state.names[state.who])+' 作答中</span>':'<span class="chip">自测</span>';
  var items=p.items.map(function(it,i){
    var key=p.id+"-"+i, cur=a[key];
    var opts=SCALE.map(function(lab,k){
      return '<label class="opt"><input type="radio" name="q_'+key+'" value="'+(k+1)+'"'+(cur===k+1?' checked':'')+'><span>'+lab+'</span></label>';
    }).join("");
    return '<fieldset class="item"><legend>'+esc(it.t)+'</legend><div class="scale" role="radiogroup">'+opts+'</div></fieldset>';
  }).join("");
  var left=p.items.length-done;
  app.innerHTML=
  '<div class="qhead">'+who+'<span class="muted">第 '+(state.page+1)+' / '+PAGES.length+' 部分</span></div>'+
  '<div class="progress" aria-hidden="true"><i style="width:'+Math.round(state.page/PAGES.length*100)+'%"></i></div>'+
  '<div class="sheet stack" style="margin-top:16px">'+
    '<div><h2>'+esc(p.name)+'</h2><p class="muted" style="margin-top:4px">'+esc(p.desc)+'</p></div>'+
    items+
  '</div>'+
  '<div class="foot">'+
    '<button class="btn ghost" data-act="prev"'+(state.page===0?' disabled':'')+'>上一部分</button>'+
    '<span class="hint" id="hint">'+(left>0?'还有 '+left+' 题没选':'')+'</span>'+
    '<button class="btn" id="nextBtn" data-act="next"'+(left>0?' disabled':'')+'>'+(isLast?'查看结果':'下一部分')+'</button>'+
  '</div>';
}

function answeredOnPage(){
  var p=PAGES[state.page], a=state.ans[state.who], n=0;
  p.items.forEach(function(it,i){if(a[p.id+"-"+i])n++;});
  return n;
}

function renderHandoff(){
  app.innerHTML=
  '<div class="stack">'+
   '<div><p class="eyebrow">'+dotFor(0)+esc(state.names[0])+' 已完成</p>'+
   '<h2 style="margin-top:6px">请把设备交给 '+esc(state.names[1])+'</h2>'+
   '<p class="lead">'+esc(state.names[0])+' 的答案已保存在本页，不会显示出来。轮到 '+esc(state.names[1])+' 时，请按自己的真实想法选，不用参考对方。</p></div>'+
   '<div class="row"><button class="btn" data-act="startB">'+esc(state.names[1])+' 开始作答</button></div>'+
  '</div>';
}

/* ---------- scoring ---------- */
function score(ans){
  var out={doms:[],items:{},ideal:0,overall:0};
  DOMAINS.forEach(function(d){
    var sum=0;
    d.items.forEach(function(it,i){
      var k=d.id+"-"+i, raw=ans[k], s=it.r?6-raw:raw;
      out.items[k]=s; sum+=s;
    });
    var m=sum/d.items.length;
    out.doms.push({id:d.id,name:d.name,mean:m,pct:Math.round((m-1)/4*100)});
  });
  var t=0; IDEAL.items.forEach(function(it,i){t+=ans["ideal-"+i];});
  out.ideal=t/IDEAL.items.length;
  out.overall=Math.round(out.doms.reduce(function(s,x){return s+x.pct;},0)/out.doms.length);
  return out;
}
function lvl(p){return p>=75?["▲","优势"]:p>=50?["◆","还可以更好"]:["▼","需要多聊"];}
function pairTag(a,b){
  var g=Math.abs(a-b), avg=(a+b)/2;
  if(a>=75&&b>=75)return["▲","共同优势"];
  if(g>=25)return["≠","看法不一"];
  if(a<50&&b<50)return["▼","共同的难题"];
  return lvl(avg);
}

/* ---------- results ---------- */
function renderResults(){
  var couple=state.mode==="couple";
  var people=couple?[0,1]:[0];
  var sc=people.map(function(i){return score(state.ans[i]);});
  var nm=people.map(function(i){return state.names[i];});
  var colors=["var(--a)","var(--b)"];

  // 总览
  var tiles=people.map(function(pi,k){
    var s=sc[k];
    var strong=s.doms.filter(function(d){return d.pct>=75;}).length;
    var weak=s.doms.filter(function(d){return d.pct<50;}).length;
    return '<div class="tile"><span class="who">'+(couple?dotFor(pi)+esc(nm[k]):'你的结果')+'</span>'+
      '<span class="big">'+s.overall+'<small> / 100</small></span>'+
      '<span class="muted">'+strong+' 个话题是优势 · '+weak+' 个话题需要多聊</span></div>';
  }).join("");

  var pairLine="";
  if(couple){
    var both=0, split=0;
    sc[0].doms.forEach(function(d,i){
      var b=sc[1].doms[i];
      if(d.pct>=75&&b.pct>=75)both++;
      if(Math.abs(d.pct-b.pct)>=25)split++;
    });
    pairLine='<div class="tile"><span class="who">你们之间</span><span class="big">'+both+'<small> 个共同优势</small></span><span class="muted">'+split+' 个话题两人看法差距明显（25 分以上）</span></div>';
  }

  // 理想化提示
  var idealNotes=people.map(function(pi,k){
    var v=sc[k].ideal;
    if(v>=4)return '<p>'+(couple?esc(nm[k])+'：':'')+'最后一部分里，“从来没有”“完全一致”这类绝对的说法你选得很高（平均 '+v.toFixed(1)+'）。热恋期或不想让答卷“不好看”时常这样。上面的分数可能偏乐观，建议对照具体题目再聊。</p>';
    return '';
  }).join("");
  if(!idealNotes)idealNotes='<p>最后一部分“绝对化”的说法没有选得特别高，这次的回答看起来比较贴近真实感受。</p>';

  // 优先聊
  var rank=DOMAINS.map(function(d,i){
    var ps=sc.map(function(s){return s.doms[i].pct;});
    var avg=ps.reduce(function(a,b){return a+b;},0)/ps.length;
    var gap=couple?Math.abs(ps[0]-ps[1]):0;
    return {d:d,i:i,avg:avg,gap:gap,urg:(100-avg)+gap*0.6};
  }).sort(function(a,b){return b.urg-a.urg;}).slice(0,3);
  var prio=rank.map(function(r){
    var why=[];
    if(couple&&r.gap>=25)why.push('两人的得分相差 '+Math.round(r.gap)+' 分');
    if(r.avg<50)why.push((couple?'平均':'得分')+'只有 '+Math.round(r.avg)+' 分');
    else if(!why.length)why.push((couple?'平均':'得分')+' '+Math.round(r.avg)+' 分，相对其他话题偏低');
    return '<div class="prio"><h3>'+esc(r.d.name)+'</h3><p class="why">'+why.join('，')+'</p><ul>'+r.d.talk.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>';
  }).join("");

  // 话题条形图
  var legend='<div class="legend">'+(couple?people.map(function(pi,k){return '<span><i class="sw" style="background:'+colors[pi]+'"></i>'+esc(nm[k])+'</span>';}).join(""):'<span><i class="sw" style="background:var(--a)"></i>你的得分</span>')+
    '<span class="muted">竖线：50 分、75 分</span></div>';
  var doms=DOMAINS.map(function(d,i){
    var tag;
    if(couple)tag=pairTag(sc[0].doms[i].pct,sc[1].doms[i].pct);
    else tag=lvl(sc[0].doms[i].pct);
    var bars=people.map(function(pi,k){
      var v=sc[k].doms[i].pct, label=(couple?nm[k]+' · ':'')+d.name+' · '+v+' 分';
      return '<div class="barrow'+(couple?'':' solo')+'">'+(couple?'<span class="nm">'+esc(nm[k])+'</span>':'')+
        '<div class="track"><i class="fill" tabindex="0" style="width:'+v+'%;background:'+colors[pi]+'" data-tip="'+esc(label)+'" aria-label="'+esc(label)+'"></i></div><b>'+v+'</b></div>';
    }).join("");
    return '<article class="dom"><header><h3>'+esc(d.name)+'</h3><span class="tag">'+tag[0]+' '+tag[1]+'</span></header>'+
      '<div class="bars">'+bars+'</div>'+
      '<details><summary>聊一聊</summary><ul>'+d.talk.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></details></article>';
  }).join("");

  // 题目层面的分歧（双人）
  var diffHtml="";
  if(couple){
    var all=[];
    DOMAINS.forEach(function(d){
      d.items.forEach(function(it,i){
        var k=d.id+"-"+i, a=sc[0].items[k], b=sc[1].items[k];
        all.push({k:k,d:d,it:it,gap:Math.abs(a-b),a:a,b:b,min:Math.max(a,b)});
      });
    });
    var split=all.filter(function(x){return x.gap>=2;}).sort(function(x,y){return y.gap-x.gap;}).slice(0,8);
    var bothLow=all.filter(function(x){return x.min<=2;}).slice(0,6);
    function ansRow(x){
      return '<div class="ans">'+[0,1].map(function(pi){return '<span>'+dotFor(pi)+esc(state.names[pi])+'：'+SCALE[state.ans[pi][x.k]-1]+'</span>';}).join("")+'</div>';
    }
    diffHtml=
     '<section class="sheet stack"><h2>两人想法差得最远的题</h2>'+
     (split.length?split.map(function(x){return '<div class="diff"><span class="muted">'+esc(x.d.name)+'</span><p>'+esc(x.it.t)+'</p>'+ansRow(x)+'</div>';}).join(""):'<p class="muted">没有哪道题的看法差距特别大。</p>')+'</section>'+
     '<section class="sheet stack"><h2>你们都觉得有问题的题</h2>'+
     (bothLow.length?bothLow.map(function(x){return '<div class="diff"><span class="muted">'+esc(x.d.name)+'</span><p>'+esc(x.it.t)+'</p>'+ansRow(x)+'</div>';}).join(""):'<p class="muted">没有出现两个人都明显不满意的题。</p>')+'</section>';
  }

  // 数据表
  var head='<tr><th>话题</th>'+people.map(function(pi,k){return '<th>'+esc(nm[k])+'</th>';}).join("")+(couple?'<th>差距</th>':'')+'</tr>';
  var rows=DOMAINS.map(function(d,i){
    return '<tr><td>'+esc(d.name)+'</td>'+people.map(function(pi,k){return '<td>'+sc[k].doms[i].pct+'</td>';}).join("")+(couple?'<td>'+Math.abs(sc[0].doms[i].pct-sc[1].doms[i].pct)+'</td>':'')+'</tr>';
  }).join("");

  app.innerHTML=
  '<div class="stack">'+
   '<div><p class="eyebrow">结果</p><h1 style="margin-top:8px">'+(couple?'你们的默契地图':'你的结果')+'</h1>'+
   '<p class="lead">分数是 0–100，只在“这一次、这个人的感受”里有意义。重点看哪里差得多、哪里两个人都不踏实。</p></div>'+
   '<div class="tiles">'+tiles+pairLine+'</div>'+
   '<div class="note">'+idealNotes+'</div>'+
   '<section class="sheet stack"><h2>建议先聊这三个话题</h2>'+prio+'</section>'+
   '<section class="sheet"><h2 style="margin-bottom:10px">十二个话题的得分</h2>'+legend+'<div style="margin-top:8px">'+doms+'</div>'+
    '<details><summary>查看数据表</summary><div class="scroll"><table>'+head+rows+'</table></div></details></section>'+
   diffHtml+
   '<section class="sheet stack"><h2>怎么用这份结果</h2>'+
    '<ul class="muted" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">'+
    '<li>先聊分歧，再聊弱项，最后聊优势。优势也值得说出口，让对方知道你在意。</li>'+
    '<li>每次只聊一个话题，每人先说自己的感受，再说想要什么，不急着下结论。</li>'+
    '<li>得分低不代表不合适，只说明那里还没谈清楚。反过来，分数高也不等于不需要再聊。</li>'+
    '<li>如果谈到某个话题就感到害怕、被控制或被伤害，请先联系可信任的人或专业机构（例如全国妇联 12338 妇女维权公益服务热线），不必靠一份问卷来判断。</li></ul></section>'+
   '<div class="row"><button class="btn" data-act="copy">复制结果文字</button><button class="btn ghost" data-act="restart">重新开始</button></div>'+
   '<div id="copyBox"></div>'+
  '</div>';
  state._result={sc:sc,nm:nm,couple:couple};
}

function resultText(){
  var r=state._result, lines=["婚前默契问卷 结果"];
  r.sc.forEach(function(s,k){
    lines.push("");
    lines.push((r.couple?r.nm[k]:"我")+"：总分 "+s.overall+"/100");
    s.doms.forEach(function(d){lines.push("  "+d.name+"："+d.pct);});
  });
  return lines.join("\n");
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var m=e.target.closest("[data-mode]");
  if(m){
    state.mode=m.getAttribute("data-mode");
    state.ans=[{},{}]; state.who=0; state.page=0; state.names=["甲方","乙方"];
    if(state.mode==="couple"){renderSetup();}else{renderQuiz();}
    top(); return;
  }
  var b=e.target.closest("[data-act]");
  if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="home"){renderIntro();top();}
  else if(act==="start"){
    var a=document.getElementById("nameA").value.trim(), c=document.getElementById("nameB").value.trim();
    state.names=[a||"甲方",c||"乙方"];
    if(state.names[0]===state.names[1])state.names[1]+="（2）";
    state.who=0; state.page=0; renderQuiz(); top();
  }
  else if(act==="prev"){ if(state.page>0){state.page--; renderQuiz(); top();} }
  else if(act==="next"){
    if(answeredOnPage()<PAGES[state.page].items.length)return;
    if(state.page<PAGES.length-1){state.page++; renderQuiz(); top();}
    else if(state.mode==="couple"&&state.who===0){renderHandoff(); top();}
    else{renderResults(); top();}
  }
  else if(act==="startB"){state.who=1; state.page=0; renderQuiz(); top();}
  else if(act==="restart"){state={mode:null,names:["甲方","乙方"],who:0,page:0,ans:[{},{}]}; renderIntro(); top();}
  else if(act==="copy"){
    var txt=resultText(), box=document.getElementById("copyBox");
    var fallback=function(){
      box.innerHTML='<p class="muted" style="margin:12px 0 6px">当前环境不能自动复制，请手动选中下面的文字：</p><textarea id="copyArea" readonly></textarea>';
      var ta=document.getElementById("copyArea"); ta.value=txt; ta.focus(); ta.select();
    };
    try{
      navigator.clipboard.writeText(txt).then(function(){
        box.innerHTML='<p class="muted" style="margin-top:12px">已复制。</p>';
      },fallback);
    }catch(err){fallback();}
  }
});

app.addEventListener("change",function(e){
  var t=e.target;
  if(!t||t.type!=="radio"||t.name.indexOf("q_")!==0)return;
  state.ans[state.who][t.name.slice(2)]=parseInt(t.value,10);
  var left=PAGES[state.page].items.length-answeredOnPage();
  var nb=document.getElementById("nextBtn"), h=document.getElementById("hint");
  if(nb)nb.disabled=left>0;
  if(h)h.textContent=left>0?"还有 "+left+" 题没选":"";
});

/* 悬停/聚焦提示 */
function showTip(el,x,y){
  tip.textContent=el.getAttribute("data-tip");
  tip.style.opacity="1";
  var w=tip.offsetWidth, px=Math.min(Math.max(8,x-w/2),window.innerWidth-w-8);
  tip.style.left=px+"px"; tip.style.top=Math.max(8,y-36)+"px";
}
function hideTip(){tip.style.opacity="0";}
app.addEventListener("pointermove",function(e){var el=e.target.closest("[data-tip]"); if(el)showTip(el,e.clientX,e.clientY); else hideTip();});
app.addEventListener("pointerleave",hideTip);
app.addEventListener("focusin",function(e){var el=e.target.closest&&e.target.closest("[data-tip]"); if(el){var r=el.getBoundingClientRect(); showTip(el,r.right,r.top);}});
app.addEventListener("focusout",hideTip);

renderIntro();
})();
</script>
</body>
</html>
