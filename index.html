<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亲密关系图谱 · ENRICH 框架模拟测评</title><style>
:root{--bg:#f5f4f0;--card:#fffefa;--ink:#202824;--muted:#69736c;--line:#e4e7de;--accent:#39745f;--blue:#477ba7;--orange:#d18759;--soft:#e7f1eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'PingFang SC','Microsoft Yahei',sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:820px;margin:auto;padding:28px 16px 65px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px}.brand{font-size:13px;letter-spacing:1.5px;color:var(--accent);font-weight:800}.muted{color:var(--muted)}.small{font-size:13px}h1{font-size:clamp(30px,6vw,47px);line-height:1.2;letter-spacing:-1.3px;margin:12px 0 18px}h2{font-size:23px;line-height:1.3;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 12px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:24px;margin:16px 0}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.8px}.btn{border:none;background:var(--accent);color:white;border-radius:11px;padding:12px 20px;min-height:46px;font-weight:650}.btn.secondary{background:transparent;color:var(--ink);border:1px solid #c7d0c8}.btn:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;text-align:left;padding:17px;width:100%}.choice.active{border:2px solid var(--accent);background:var(--soft);padding:16px}.choice b{display:block;margin-bottom:4px}.choice span{display:block;font-size:13px;color:var(--muted)}.field{display:block;margin:14px 0;font-size:14px;font-weight:650}.field input{display:block;margin-top:6px;width:100%;border:1px solid var(--line);padding:12px;border-radius:10px;background:white;color:var(--ink)}.notice{border-left:3px solid #92ad9b;padding:10px 14px;background:#edf2eb;border-radius:4px;color:#4e6556;font-size:13px;margin:20px 0}.progress{height:7px;background:#dce3da;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.question{border-bottom:1px solid var(--line);padding:20px 0}.question:last-child{border-bottom:none}.qtitle{font-size:16px;font-weight:600;margin-bottom:12px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.scale button{background:white;border:1px solid #dce2da;border-radius:9px;min-height:52px;padding:6px 3px;font-size:13px;color:#59685f}.scale button.selected{background:var(--accent);color:white;border-color:var(--accent);font-weight:700}.pill{font-size:12px;border-radius:30px;padding:5px 10px;background:#e9f0e9;color:var(--accent);font-weight:750;display:inline-block}.metric{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.stat strong{font-size:32px;display:block;font-variant-numeric:tabular-nums}.stat small{color:var(--muted)}.type{background:#244e40;color:white;border-radius:20px;padding:28px;margin:20px 0}.type .eyebrow{color:#badbc6}.type h2{font-size:36px;margin:12px 0}.type p{color:#dce9e0}.barrow{margin:19px 0}.barhead{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;margin-bottom:7px}.track{background:#e7eae4;height:11px;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:10px}.pairbar{display:flex;gap:3px;align-items:center}.pairbar>div{height:9px;border-radius:7px}.tag{display:inline-block;border-radius:6px;background:#f0f3ed;padding:2px 7px;color:#52705b;font-size:12px}.diff{padding:12px 0;border-bottom:1px solid var(--line)}.diff:last-child{border:0}.answers{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:5px}.blue{color:var(--blue)}.orange{color:var(--orange)}.footer{font-size:12px;color:var(--muted);line-height:1.8;margin-top:30px}a{color:var(--accent)}@media(max-width:560px){.grid,.metric{grid-template-columns:1fr}.card{padding:18px}.scale{gap:4px}.scale button{font-size:11px;min-height:56px}.wrap{padding:20px 12px 50px}.type h2{font-size:30px}}
@media print{body{background:white}.btn,.top button,.actions{display:none!important}.card,.stat,.type{break-inside:avoid}.wrap{max-width:100%;padding:8px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">RELATIONSHIP ATLAS <span style="color:#84958a">/ 关系图谱</span></div><button class="btn secondary small" onclick="toggleInfo()">测评说明</button></div><div id="app"></div><div class="footer">基于 PREPARE/ENRICH 公开理论的原创教育性模拟测评，非官方授权测试。所有答案仅在当前浏览器本地处理，不发送服务器。<br>参考：<a href="https://www.prepare-enrich.com/wp-content/uploads/2020/12/Scientific_Foundation.pdf" target="_blank">PREPARE/ENRICH Scientific Foundation</a> · <a href="https://www.prepare-enrich.com/wp-content/uploads/2020/12/study6.pdf" target="_blank">Olson & Fowers 关系类型研究</a></div></main><script>
const DOMAIN=[
['沟通','comm',['我能够坦诚表达真实想法，而不担心被嘲笑或否定。','伴侣会认真倾听，尝试理解我没有说出口的情绪。','重要的话题我们能够直接讨论，而不是一直回避。','即使意见不同，我们也能尊重彼此的观点。','我经常觉得自己说的话没有被理解。']],
['冲突解决','conf',['出现分歧时，我们能够讨论问题而不是攻击对方。','吵架之后我们通常能够修复关系。','我们能一起找到双方都可以接受的解决方案。','我们愿意承认自己的失误并道歉。','矛盾发生后，我们往往长期冷战或翻旧账。']],
['性格与生活习惯','habit',['我能够接受伴侣有不同于我的性格特点。','我们能够协商作息、整洁等日常习惯。','我不会把改变对方当成关系继续的前提。','对方尊重我的私人空间与个人节奏。','伴侣的一些习惯让我对长期生活感到担忧。']],
['财务管理','money',['我们能够坦诚讨论收入、支出与债务。','我们对储蓄与消费的优先顺序基本一致。','大额支出发生前，我们愿意共同商量。','我们尊重彼此在金钱上的合理自主权。','我们经常因为钱发生难以解决的争执。']],
['休闲活动','leisure',['我们都满意共同相处的时间。','我们能找到双方真正感兴趣的活动。','我们尊重彼此独立的爱好与社交安排。','安排假期或周末时，我们能协商达成共识。','我经常因彼此对休闲时间的期待不同而失望。']],
['亲密关系','intimacy',['我们能够表达对情感或身体亲密的需要。','我们尊重彼此的亲密边界与同意。','我对目前的情感亲近程度感到满意。','双方都愿意理解对方表达爱意的方式。','我们在亲密需求上的差异常让我感到困扰。']],
['家庭与朋友','family',['我们能够尊重彼此与亲友的关系。','当亲友的意见影响我们时，我们会共同讨论。','我们可以商量节假日的家庭安排。','伴侣愿意在家庭边界问题上与我站在同一阵线。','亲友对我们关系的干涉使我持续感到压力。']],
['关系角色与责任','roles',['我们对家务及家庭事务分工大体满意。','双方的工作与个人发展都得到尊重。','出现额外家庭责任时，我们会共同承担。','重要决定不会因性别或收入而由一方单独支配。','我觉得我们承担的责任明显不公平。']],
['价值观与信念','values',['我们可以尊重彼此的价值观差异。','我们对未来重要的人生选择有基本共识。','即使生活习俗或信念不同，也可以和平相处。','面对重大人生变化，我们愿意共同调整计划。','我们的核心价值观差异让我对未来感到担忧。']]];
const EXTRA=[['整体关系感受','overall',['我对目前这段关系整体感到满意。','我对我们一起面对未来有信心。','当我需要支持时，伴侣通常愿意回应。','我觉得自己在这段关系里受到尊重。','如果重新选择，我仍愿意与这个人建立关系。']],['理想化倾向','ideal',['我们之间从来没有真正的分歧。','伴侣的所有行为都让我满意。','我们对所有重要问题的看法完全一样。','我们的关系从来不需要努力经营。','伴侣总能百分之百猜中我的想法。']]];
const SECTIONS=DOMAIN.concat(EXTRA);const LABELS=['非常不同意','不同意','不确定','同意','非常同意'];let s={stage:'married',mode:'couple',names:['甲方','乙方'],person:0,page:0,answers:[{},{}],screen:'intro'};const STORE_KEY='enrich_relationship_v2';function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({stage:s.stage,mode:s.mode,names:s.names,person:s.person,page:s.page,answers:s.answers,screen:s.screen}))}catch(e){}}function restore(){try{const a=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(a&&['intro','quiz','handoff','result'].includes(a.screen)&&Array.isArray(a.answers)&&a.answers.length===2){s={...s,...a};if(s.screen==='result'&&!completed(0))s.screen='intro';if(s.screen==='result'&&s.mode==='couple'&&!completed(1))s.screen='handoff';return true}}catch(e){}return false}function completed(i){return SECTIONS.every((sec,page)=>sec[2].every((_,q)=>s.answers[i][`${page}-${q}`]!==undefined))}const root=document.getElementById('app');const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function btn(txt,fn,secondary=false,disabled=false){return `<button class="btn ${secondary?'secondary':''}" ${disabled?'disabled':''} onclick="${fn}">${txt}</button>`}function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}function toggleInfo(){alert('这是原创模拟版，非 PREPARE/ENRICH 官方量表。婚前参考四类，婚后参考五类。模拟 PCA = 双方同一道题都选择健康方向（正向题4/5分，反向题1/2分）的题目比例。正式系统的完整题库、常模与分类模型没有公开，因此分类仅作教育性参考，不能与综艺嘉宾的结果直接比较。')}
function render(){save();if(s.screen==='intro')intro();else if(s.screen==='quiz')quiz();else if(s.screen==='handoff')handoff();else result()}
function intro(){root.innerHTML=`<div class="eyebrow">双人关系评估 · 互动测评</div><h1>看见你们的<br><span style="color:var(--accent)">亲密关系图谱。</span></h1><p class="muted">55 道原创题 · 11 个主题 · 单人 / 双人作答 · 关系类型参考</p><div class="notice">目标是还原 ENRICH 研究框架中的“关系类型 + 积极一致度 + 关系优势与成长领域”这套展示逻辑，而非声称复刻其未公开的官方算法。</div><div class="card"><h3>01 · 选择关系阶段</h3><div class="grid"><button class="choice ${s.stage==='premarital'?'active':''}" onclick="s.stage='premarital';render()"><b>婚前 / 恋爱中</b><span>参考 PREPARE 四种类型</span></button><button class="choice ${s.stage==='married'?'active':''}" onclick="s.stage='married';render()"><b>已婚</b><span>参考 ENRICH 五种类型</span></button></div><h3 style="margin-top:26px">02 · 选择答题方式</h3><div class="grid"><button class="choice ${s.mode==='couple'?'active':''}" onclick="s.mode='couple';render()"><b>两个人分别做 · 推荐</b><span>更接近官方的关系评估逻辑</span></button><button class="choice ${s.mode==='solo'?'active':''}" onclick="s.mode='solo';render()"><b>一个人做</b><span>只呈现自我感受，不判定双方关系类型</span></button></div><h3 style="margin-top:26px">03 · 填写称呼</h3><div class="grid"><label class="field">第一位<input maxlength="16" id="n1" value="${safe(s.names[0])}" placeholder="甲方"></label><label class="field" id="secondName">第二位<input maxlength="16" id="n2" value="${safe(s.names[1])}" placeholder="乙方" ${s.mode==='solo'?'disabled':''}></label></div><p class="small muted">每人 55 题，共 11 组，每组 5 题。可返回修改；刷新页面可能丢失进度。</p>${btn('开始测评 →','start()')}</div>`}
function start(){s.names=[document.getElementById('n1').value.trim()||'甲方',document.getElementById('n2').value.trim()||'乙方'];s.person=0;s.page=0;s.answers=[{},{}];s.screen='quiz';render();scrollTop()}
function quiz(){let sec=SECTIONS[s.page],a=s.answers[s.person];let number=s.page+1;let done=sec[2].filter((_,i)=>a[`${s.page}-${i}`]!==undefined).length;root.innerHTML=`<div class="eyebrow">${s.mode==='solo'?'个人作答':safe(s.names[s.person])+' · 独立作答'}</div><h2 style="margin:9px 0 14px">${safe(sec[0])}</h2><div class="small muted" style="margin-bottom:8px">第 ${number} / ${SECTIONS.length} 组 · ${Math.round((s.page/SECTIONS.length)*100)}% 已完成</div><div class="progress"><div style="width:${s.page/SECTIONS.length*100}%"></div></div><div class="card">${sec[2].map((q,i)=>`<div class="question"><div class="qtitle">${(s.page*5+i+1).toString().padStart(2,'0')}. ${safe(q)}</div><div class="scale">${LABELS.map((l,v)=>`<button class="${a[`${s.page}-${i}`]===v+1?'selected':''}" onclick="answer(${i},${v+1})">${l}</button>`).join('')}</div></div>`).join('')}</div><div class="actions">${btn('← 上一组','prev()',true,s.page===0)}<span class="small muted" id="remaining">${done}/5 已回答</span>${btn(s.page===SECTIONS.length-1?'完成作答 →':'下一组 →','next()',false,done!==5)}</div>`}
function answer(i,v){s.answers[s.person][`${s.page}-${i}`]=v;save();quiz()};function prev(){if(s.page>0){s.page--;render();scrollTop()}}function next(){if(SECTIONS[s.page][2].some((_,i)=>s.answers[s.person][`${s.page}-${i}`]===undefined))return;if(s.page<SECTIONS.length-1){s.page++;render();scrollTop()}else if(s.mode==='couple'&&s.person===0){s.screen='handoff';render();scrollTop()}else{s.screen='result';render();scrollTop()}}
function handoff(){root.innerHTML=`<div class="eyebrow">第一位已完成 · 已保存本地</div><h1>接下来由<br>${safe(s.names[1])} 作答。</h1><div class="card"><p>${safe(s.names[0])} 的55道答案已保存在这个浏览器中，第二位可以现在或以后再答。两个人全部完成后才会生成共同关系类型。</p>${btn('开始第二位的测评 →','continuePartner()')}<p class="small muted" style="margin-top:14px">你也可以先看第一人的个人报告，然后从报告中继续补测。</p>${btn('先查看个人报告','s.mode="solo";s.person=0;s.screen="result";render();scrollTop()',true)}</div>`}
function continuePartner(){s.mode='couple';s.person=1;s.page=0;s.screen='quiz';render();scrollTop()}function addPartner(){s.mode='couple';s.person=1;s.page=0;s.screen='quiz';render();scrollTop()}function norm(page,i,person){let v=s.answers[person][`${page}-${i}`];return i===4 && page<9?6-v:v}function individual(p,page){let z=Array.from({length:5},(_,i)=>norm(page,i,p));return Math.round((z.reduce((a,b)=>a+b,0)-5)/20*100)}function pca(page){let yes=0;for(let i=0;i<5;i++){if(norm(page,i,0)>=4&&norm(page,i,1)>=4)yes++}return yes*20}function avg(x){return x.reduce((a,b)=>a+b,0)/x.length}
function classify(scores){let x=avg(scores),comm=avg(scores.slice(0,2)),roles=scores[7],values=scores[8],weak=scores.filter(v=>v<=20).length,strong=scores.filter(v=>v>=60).length;let kind;if(x>=67&&strong>=7)kind='活力型';else if(x>=46&&strong>=4)kind='和谐型';else if(x>=27 &&(roles>=comm+20||values>=comm+20||x>=38))kind='传统型';else if(x>=21&&weak<=5)kind='冲突型';else kind=s.stage==='married'?'失活型':'冲突型';return kind}
const descriptions={'活力型':'大多数核心关系维度存在较高积极一致度，通常在沟通与冲突修复上也表现较好。','和谐型':'多方面有较好的积极一致，但仍存在需要商量和经营的主题。','传统型':'部分家庭角色或价值观维度较稳定，沟通与冲突解决方面可能是需要进一步提升的部分。','冲突型':'若干维度的积极一致度偏低，适合优先讨论反复出现的分歧和相互感受。','失活型':'多数核心领域的积极一致较少，可能需要更多支持来理解关系中长期存在的问题。'};
function result(){const couple=s.mode==='couple',pcs=DOMAIN.map((_,i)=>couple?pca(i):individual(0,i)),type=couple?classify(pcs):null,mean=Math.round(avg(pcs)),strength=pcs.filter(v=>v>=60).length,growth=pcs.filter(v=>v<=20).length;let sorted=DOMAIN.map((d,i)=>({name:d[0],i,pca:pcs[i]})).sort((a,b)=>a.pca-b.pca);let diff=[];if(couple){DOMAIN.forEach((d,i)=>d[2].forEach((q,j)=>{let a=norm(i,j,0),b=norm(i,j,1);diff.push({q,domain:d[0],gap:Math.abs(a-b),a:s.answers[0][`${i}-${j}`],b:s.answers[1][`${i}-${j}`],bothLow:a<=2&&b<=2})}));diff.sort((a,b)=>b.gap-a.gap)}let ideal=individual(0,10),ideal2=couple?individual(1,10):null;
root.innerHTML=`<div class="eyebrow">RELATIONSHIP REPORT · 测评报告</div><h1>${couple?'你们的关系图谱':'你的关系感受'}</h1><p class="muted">${s.stage==='married'?'婚后 ENRICH 五型框架':'婚前 PREPARE 四型框架'} · ${couple?'双方都已完成 · 双人积极一致度模拟':'第一人已完成 · 等待第二人补测'} · 每人55题</p>${couple?`<section class="type"><div class="eyebrow">模拟关系类型 · 非官方判定</div><h2>${type} · ${({'活力型':'Vitalized','和谐型':'Harmonious','传统型':'Conventional','冲突型':'Conflicted','失活型':'Devitalized'})[type]}</h2><p>${descriptions[type]}</p><p style="font-size:12px;opacity:.8;margin-top:17px">这是原创题目的启发式分类，不等同于节目/官方系统结果；接近分类边界时尤其不稳定。</p></section>`:`<div class="notice"><b>第一人的个人报告已完成。</b> 单人不能判定共同关系类型。你可以让第二个人现在或以后接着完成55题，合并后会显示婚前四型／婚后五型的模拟关系类型。</div><div class="card"><h2>合并两个人的结果</h2><p>第一人的答案已保存在此浏览器。第二人独立作答后，会自动对比双方答案，并在报告最上方给出关系类型结果。</p><label class="field">第二个人的称呼<input id="partnerName" maxlength="16" value="${safe(s.names[1])}" placeholder="乙方"></label>${btn('让第二个人开始作答 →','startPartnerFromReport()')}</div>`}<div class="metric"><div class="stat"><strong>${mean}<small> /100</small></strong><small>${couple?'九个领域平均积极一致度':'九个领域平均个人得分'}</small></div><div class="stat"><strong>${strength}</strong><small>${couple?'积极一致度 ≥60 的领域':'个人得分 ≥60 的领域'}</small></div><div class="stat"><strong>${growth}</strong><small>${couple?'积极一致度 ≤20 的领域':'个人得分 ≤20 的领域'}</small></div></div><section class="card"><h2>九个核心关系维度</h2><p class="small muted">${couple?'绿色表示双方在健康方向同时认同的题目比例（0、20、40、60、80、100），不是个人满意度平均。':'绿色表示你对这一维度的主观评价标准化分数。'}</p>${DOMAIN.map((d,i)=>`<div class="barrow"><div class="barhead"><span>${safe(d[0])}</span><span>${pcs[i]} / 100</span></div><div class="track"><div class="fill" style="width:${pcs[i]}%"></div></div>${couple?`<div class="small muted">${safe(s.names[0])} 个人得分 ${individual(0,i)} · ${safe(s.names[1])} 个人得分 ${individual(1,i)}</div>`:''}</div>`).join('')}</section><section class="card"><h2>关系优势与成长领域</h2><p class="small muted">根据本次自制问卷排序，不代表官方标准。</p><h3>最值得优先聊的三个领域</h3>${sorted.slice(0,3).map(x=>`<div class="diff"><b>${safe(x.name)}</b> <span class="tag">${x.pca}/100</span><p class="small muted" style="margin-top:5px">${couple?'双方积极一致的题目相对较少':'你的主观得分相对较低'}。建议分别举一个真实生活中的例子，再讨论希望对方怎样回应。</p></div>`).join('')}<h3 style="margin-top:24px">目前相对顺畅的领域</h3><p>${sorted.slice(-3).reverse().map(x=>`${x.name}（${x.pca}）`).join('、')}</p></section>${couple?`<section class="card"><h2>双方感受差异最大的题目</h2>${diff.filter(d=>d.gap>=2).slice(0,8).map(d=>`<div class="diff"><div class="small muted">${safe(d.domain)}</div><b>${safe(d.q)}</b><div class="answers"><span class="blue">${safe(s.names[0])}：${LABELS[d.a-1]}</span><span class="orange">${safe(s.names[1])}：${LABELS[d.b-1]}</span></div></div>`).join('')||'<p class="muted">没有出现差异达到两档以上的题目。</p>'}</section><section class="card"><h2>双方都觉得困难的题目</h2>${diff.filter(d=>d.bothLow).slice(0,6).map(d=>`<div class="diff"><div class="small muted">${safe(d.domain)}</div><b>${safe(d.q)}</b><div class="answers"><span class="blue">${safe(s.names[0])}：${LABELS[d.a-1]}</span><span class="orange">${safe(s.names[1])}：${LABELS[d.b-1]}</span></div></div>`).join('')||'<p class="muted">未发现两位都明确评价为不理想的条目。</p>'}</section>`:''}<section class="card"><h2>整体感受与理想化提醒</h2><p>${safe(s.names[0])}的整体关系感受：${individual(0,9)}/100；理想化条目均值：${(1+ideal*4/100).toFixed(1)}/5。</p>${couple?`<p>${safe(s.names[1])}的整体关系感受：${individual(1,9)}/100；理想化条目均值：${(1+ideal2*4/100).toFixed(1)}/5。</p>`:''}<p class="small muted">理想化题的高分提示可能存在较绝对的关系期待，不能据此判断是否说谎。整体感受题与理想化题不参与上述类型分类。</p></section><section class="card"><h2>怎么算出来的？</h2><p>每人回答五级量表，核心九维每维5道题。每个领域的模拟积极一致度 PCA = 该领域中双方都给出积极回答的题目数 ÷ 5 × 100%。反向题先反向计分。</p><p>关系类型使用依据公开研究趋势设计的启发式规则，参考积极一致度整体水平及沟通、冲突、角色与价值观的相对形态。<b>它不是官方分类算法，也没有完成信效度验证。</b>正式的类型结果需要两人使用官方问卷，由经过培训的专业人员进行解读。</p><p class="small muted">参考：Olson & Fowers (1993)；PREPARE/ENRICH Scientific Foundation。历史版本、题目组合及节目制作方式可能不同。</p></section><div class="actions">${btn('保存报告为 PDF','window.print()',true)}${btn('导出报告文字','exportText()',true)}${btn('重新测评','if(confirm("确定清空当前答案吗？")){s={stage:s.stage,mode:"couple",names:["甲方","乙方"],person:0,page:0,answers:[{},{}],screen:"intro"};render();scrollTop()}')}</div>`;s._result={type,pcs,mean,sorted,couple}}
function startPartnerFromReport(){const el=document.getElementById('partnerName');if(el)s.names[1]=el.value.trim()||'乙方';addPartner()}function exportText(){let r=s._result;let lines=['亲密关系图谱（非官方 PREPARE/ENRICH 框架模拟）',`阶段：${s.stage==='married'?'已婚':'婚前'}`,`模式：${r.couple?'双人':'单人'}`,`关系类型参考：${r.type||'单人不分类'}`,`平均分：${r.mean}/100`,''];DOMAIN.forEach((d,i)=>lines.push(`${d[0]}：${r.pcs[i]}/100`));lines.push('','本报告基于原创题目与启发式规则，不是官方 ENRICH 结果。');let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='亲密关系测评报告.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}restore();render();
</script></body></html>
