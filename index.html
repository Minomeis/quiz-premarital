{border-left:3px solid #92ad9b;padding:10px 14px;background:#edf2eb;border-radius:4px;color:#4e6556;font-size:13px;margin:20px 0}.progress{height:7px;background:#dce3da;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.question{border-bottom:1px solid var(--line);padding:20px 0}.question:last-child{border-bottom:none}.qtitle{font-size:16px;font-weight:600;margin-bottom:12px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.scale button{background:white;border:1px solid #dce2da;border-radius:9px;min-height:52px;padding:6px 3px;font-size:13px;color:#59685f}.scale button.selected{background:var(--accent);color:white;border-color:var(--accent);font-weight:700}.pill{font-size:12px;border-radius:30px;padding:5px 10px;background:#e9f0e9;color:var(--accent);font-weight:750;display:inline-block}.metric{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.stat strong{font-size:32px;display:block;font-variant-numeric:tabular-nums}.stat small{color:var(--muted)}.type{background:#244e40;color:white;border-radius:20px;padding:28px;margin:20px 0}.type .eyebrow{color:#badbc6}.type h2{font-size:36px;margin:12px 0}.type p{color:#dce9e0}.barrow{margin:19px 0}.barhead{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;margin-bottom:7px}.track{background:#e7eae4;height:11px;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:10px}.pairbar{display:flex;gap:3px;align-items:center}.pairbar>div{height:9px;border-radius:7px}.tag{display:inline-block;border-radius:6px;background:#f0f3ed;padding:2px 7px;color:#52705b;font-size:12px}.diff{padding:12px 0;border-bottom:1px solid var(--line)}.diff:last-child{border:0}.answers{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:5px}.blue{color:var(--blue)}.orange{color:var(--orange)}.footer{font-size:12px;color:var(--muted);line-height:1.8;margin-top:30px}a{color:var(--accent)}@media(max-width:560px){.grid,.metric{grid-template-columns:1fr}.card{padding:18px}.scale{gap:4px}.scale button{font-size:11px;min-height:56px}.wrap{padding:20px 12px 50px}.type h2{font-size:30px}}

</style></head><body><main class="wrap"><div class="top"><div class="brand">RELATIONSHIP ATLAS <span style="color:#84958a">/ 关系图谱</span></div><button class="btn secondary small" onclick="toggleInfo()">测评说明</button></div><div id="app"></div><div class="footer">基于 PREPARE/ENRICH 公开理论的原创教育性模拟测评，非官方授权测试。所有答案仅在当前浏览器本地处理，不发送服务器。<br>参考：<a href="https://www.prepare-enrich.com/wp-content/uploads/2020/12/Scientific_Foundation.pdf" target="_blank">PREPARE/ENRICH Scientific Foundation</a> · <a href="https://www.prepare-enrich.com/wp-content/uploads/2020/12/study6.pdf" target="_blank">Olson & Fowers 关系类型研究</a></div></main><script>
const DOMAIN=[
['沟通','comm',['我能够坦诚表达真实想法，而不担心被嘲笑或否定。','伴侣会认真倾听，尝试理解我没有说出口的情绪。','重要的话题我们能够直接讨论，而不是一直回避。','即使意见不同，我们也能尊重彼此的观点。','我经常觉得自己说的话没有被理解。']],
['冲突解决','conf',['出现分歧时，我们能够讨论问题而不是攻击对方。','吵架之后我们通常能够修复关系。','我们能一起找到双方都可以接受的解决方案。','我们愿意承认自己的失误并道歉。','矛盾发生后，我们往往长期冷战或翻旧账。']],
['性格与生活习惯','habit',['我能够接受伴侣有不同于我的性格特点。','我们能够协商作息、整洁等日常习惯。','我不会把改变对方当成关系继续的前提。','对方尊重我的私人空间与个人节奏。','伴侣的一些习惯让我对长期生活感到担忧。']],
['财务管理','money',['我们能够坦诚讨论收入、支出与债务。','我们对储蓄与消费的优先顺序基本一致。','大额支出发生前，我们愿意共同商量。','我们尊重彼此在金钱上的合理自主权。','我们经常因为钱发生难以解决的争执。']],
['休闲活动','leisure',['我们都满意共同相处的时间。','我们能找到双方真正感兴趣的活动。','我们尊重彼此独立的爱好与社交安排。','安排假期或周末时，我们能协商达成共识。','我经常因彼此对休闲时间的期待不同而失望。']],
['亲密关系','intimacy',['我们能够表达对情感或身体亲密的需要。','我们尊重彼此的亲密边界与同意。','我对目前的情感亲近程度感到满意。','双方都愿意理解对方表达爱意的方式。','我们在亲密需求上的差异常让我感到困扰。']],
['家庭与朋友','family',['我们能够尊重彼此与亲友的关系。','当亲友的意见影响我们时，我们会共同讨论。','我们可以商量节假日的家庭安排。','伴侣愿意在家庭边界问题上与我站在同一阵线。','亲友对我们关系的干涉使我持续感到压力。']],
['关系角色与责任','roles',['我们对家务及家庭事务分工大体满意。','双方的工作与个人发展都得到尊重。','出现额外家庭责任时，我们会共同承担。','重要决定不会因性别或收入而由一方单独支配。','我觉得我们承担的责任明显不公平。']],
['价值观与信念','values',['我们可以尊重彼此的价值观差异。','我们对未来重要的人生选择有基本共识。','即使生活习俗或信念不同，也可以和平相处。','面对重大人生变化，我们愿意共同调整计划。','我们的核心价值观差异让我对未来感到担忧。']]];
const EXTRA=[['整体关系感受','overall',['我对目前这段关系整体感到满意。','我对我们一起面对未来有信心。','当我需要支持时，伴侣通常愿意回应。','我觉得自己在这段关系里受到尊重。','如果重新选择，我仍愿意与这个人建立关系。']],['理想化倾向','ideal',['我们之间从来没有真正的分歧。','伴侣的所有行为都让我满意。','我们对所有重要问题的看法完全一样。','我们的关系从来不需要努力经营。','伴侣总能百分之百猜中我的想法。']]];
const SECTIONS=DOMAIN.concat(EXTRA);const LABELS=['非常不同意','不同意','不确定','同意','非常同意'];let s={stage:'married',mode:'couple',names:['甲方','乙方'],person:0,page:0,answers:[{},{}],screen:'intro'};const STORE_KEY='enrich_relationship_v2';function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({stage:s.stage,mode:s.mode,names:s.names,person:s.person,page:s.page,answers:s.answers,screen:s.screen}))}catch(e){}}function restore(){try{const a=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(a&&['intro','quiz','handoff','result'].includes(a.screen)&&Array.isArray(a.answers)&&a.answers.length===2){s={...s,...a};if(s.screen==='result'&&!completed(0))s.screen='intro';if(s.screen==='result'&&s.mode==='couple'&&!completed(1))s.screen='handoff';return true}}catch(e){}return false}function completed(i){return SECTIONS.every((sec,page)=>sec[2].every((_,q)=>s.answers[i][`${page}-${q}`]!==undefined))}const root=document.getElementById('app');const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function btn(txt,fn,secondary=false,disabled=false){return `<button class="btn ${secondary?'secondary':''}" ${disabled?'disabled':''} onclick="${fn}">${txt}</button>`}function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}function toggleInfo(){alert('这是原创模拟版，非 PREPARE/ENRICH 官方量表。婚前参考四类，婚后参考五类。模拟 PCA = 双方同一道题都选择健康方向（正向题4/5分，反向题1/2分）的题目比例。正式系统的完整题库、常模与分类模型没有公开，因此分类仅作教育性参考，不能与综艺嘉宾的结果直接比较。')}
function render(){save();if(s.screen==='intro')intro();else if(s.screen==='quiz')quiz();else if(s.screen==='handoff')handoff();else result()}
function intro(){root.innerHTML=`<div class="eyebrow">双人关系评估 · 互动测评</div><h1>看见你们的<br><span style="color:var(--accent)">亲密关系图谱。</span></h1><p class="muted">55 道原创题 · 11 个主题 · 单人 / 双人作答 · 关系类型参考</p><div class="notice">目标是还原 ENRICH 研究框架中的“关系类型 + 积极一致度 + 关系优势与成长领域”这套展示逻辑，而非声称复刻其未公开的官方算法。</div><div class="card"><h3>01 · 选择关系阶段</h3><div class="grid"><button class="choice ${s.stage==='premarital'?'active':''}" onclick="s.stage='premarital';render()"><b>婚前 / 恋爱中</b><span>参考 PREPARE 四种类型</span></button><button class="choice ${s.stage==='married'?'active':''}" onclick="s.stage='married';render()"><b>已婚</b><span>参考 ENRICH 五种类型</span></button></div><h3 style="margin-top:26px">02 · 选择答题方式</h3><div class="grid"><button class="choice ${s.mode==='couple'?'active':''}" onclick="s.mode='couple';render()"><b>两个人分别做 · 推荐</b><span>更接近官方的关系评估逻辑</span></button><button class="choice ${s.mode==='solo'?'active':''}" onclick="s.mode='solo';render()"><b>一个人做</b><span>只呈现自我感受，不判定双方关系类型</span></button></div><h3 style="margin-top:26px">03 · 填写称呼</h3><div class="grid"><label class="field">第一位<input maxlength="16" id="n1" value="${safe(s.names[0])}" placeholder="甲方"></label><label class="field" id="secondName">第二位<input maxlength="16" id="n2" value="${safe(s.names[1])}" placeholder="乙方" ${s.mode==='solo'?'disabled':''}></label></div><p class="small muted">每人 55 题，共 11 组，每组 5 题。可返回修改；刷新页面可能丢失进度。</p>${btn('开始测评 →','start()')}</div>`}
function start(){s.names=[document.getElementById('n1').value.trim()||'甲方',document.getElementById('n2').value.trim()||'乙方'];s.person=0;s.page=0;s.answers=[{},{}];s.screen='quiz';render();scrollTop()}
function quiz(){let sec=SECTIONS[s.page],a=s.answers[s.person];let number=s.page+1;let done=sec[2].filter((_,i)=>a[`${s.page}-${i}`]!==undefined).length;root.innerHTML=`<div class="eyebrow">${s.mode==='solo'?'个人作答':safe(s.names[s.person])+' · 独立作答'}</div><h2 style="margin:9px 0 14px">${safe(sec[0])}</h2><div class="small muted" style="margin-bottom:8px">第 ${number} / ${SECTIONS.length} 组 · ${Math.round((s.page/SECTIONS.length)*100)}% 已完成</div><div class="progress"><div style="width:${s.page/SECTIONS.length*100}%"></div></div><div class="card">${sec[2].map((q,i)=>`<div class="question"><div class="qtitle">${(s.page*5+i+1).toString().padStart(2,'0')}. ${safe(q)}</div><div class="scale">${LABELS.map((l,v)=>`<button class="${a[`${s.page}-${i}`]===v+1?'selected':''}" onclick="answer(${i},${v+1})">${l}</button>`).join('')}</div></div>`).join('')}</div><div class="actions">${btn('← 上一组','prev()',true,s.page===0)}<span class="small muted" id="remaining">${done}/5 已回答</span>${btn(s.page===SECTIONS.length-1?'完成作答 →':'下一组 →','next()',false,done!==5)}</div>`}
function answer(i,v){s.answers[s.person][`${s.page}-${i}`]=v;save();quiz()};function prev(){if(s.page>0){s.page--;render();scrollTop()}}function next(){if(SECTIONS[s.page][2].some((_,i)=>s.answers[s.person][`${s.page}-${i}`]===undefined))return;if(s.page<SECTIONS.length-1){s.page++;render();scrollTop()}else if(s.mode==='couple'&&s.person===0){s.screen='handoff';render();scrollTop()}else{s.screen='result';render();scrollTop()}}
function handoff(){root.innerHTML=`<div class="eyebrow">第一位已完成 · 已保存本地</div><h1>接下来由<br>${safe(s.names[1])} 作答。</h1><div class="card"><p>${safe(s.names[0])} 的55道答案已保存在这个浏览器中，第二位可以现在或以后再答。两个人全部完成后才会生成共同关系类型。</p>${btn('开始第二位的测评 →','continuePartner()')}<p class="small muted" style="margin-top:14px">你也可以先看第一人的个人报告，然后从报告中继续补测。</p>${btn('先查看个人报告','s.mode="solo";s.person=0;s.screen="result";render();scrollTop()',true)}</div>`}
function continuePartner(){s.mode='couple';s.person=1;s.page=0;s.screen='quiz';render();scrollTop()}function addPartner(){s.mode='couple';s.person=1;s.page=0;s.screen='quiz';render();scrollTop()}function norm(page,i,person){let v=s.answers[person][`${page}-${i}`];return i===4 && page<9?6-v:v}function individual(p,page){let z=Array.from({length:5},(_,i)=>norm(page,i,p));return Math.round((z.reduce((a,b)=>a+b,0)-5)/20*100)}function pca(page){let yes=0;for(let i=0;i<5;i++){if(norm(page,i,0)>=4&&norm(page,i,1)>=4)yes++}return yes*20}function avg(x){return x.reduce((a,b)=>a+b,0)/x.length}
function classify(scores){let x=avg(scores),comm=avg(scores.slice(0,2)),roles=scores[7],values=scores[8],weak=scores.filter(v=>v<=20).length,strong=scores.filter(v=>v>=60).length;let kind;if(x>=67&&strong>=7)kind='活力型';else if(x>=46&&strong>=4)kind='和谐型';else if(x>=27 &&(roles>=comm+20||values>=comm+20||x>=38))kind='传统型';else if(x>=21&&weak<=5)kind='冲突型';else kind=s.stage==='married'?'失活型':'冲突型';return kind}
const TYPE_GUIDES={
 '活力型':{summary:'你们在多个领域体现出较高的积极一致度。这是一项值得珍惜的关系资源，但并不意味着永远不会有分歧。',focus:'维护优势，同时给变化和差异留出空间。',steps:['每周安排一次15分钟关系回顾：这周最被支持的时刻是什么？有没有被忽略的小事？','保留各自的兴趣、朋友与独处时间，避免把“关系好”理解为所有事情必须一致。','遇到新的重大决定时，继续用“各自期待—共同方案—再复盘”的方式沟通。'],avoid:'不要因为被归为活力型，就忽视一方偶尔说出的不舒服或不同意见。',prompt:'我们现在做得最好的一件事是什么？怎样让它在忙碌时期也能持续？'},
 '和谐型':{summary:'你们已经具备不少合作基础，但有些日常主题可能还存在未说清楚的预期。',focus:'把总体相处不错，转变为具体问题也能解决。',steps:['分别写下目前最满意的两件事和最希望改善的一件事，先互相复述，再讨论。','优先挑一个低分领域，明确“谁在什么情况下做什么”，不只停留在承诺。','每两周检查一次约定是否公平、是否可执行，必要时调整。'],avoid:'不要用“我们基本不吵架”代替真正谈论不同需求。',prompt:'有没有一件事，我们都觉得不算大事，但一直没认真商量？'},
 '传统型':{summary:'你们在角色、责任或一些生活信念方面可能较有共识，但表达感受和解决矛盾的方式仍值得关注。',focus:'让稳定的安排，也能容纳两个人平等表达需求。',steps:['各自列出目前默认承担的家务、情绪劳动和经济责任，核对是否出于自愿且双方满意。','讨论分歧时先说“这件事让我感觉……”，再说具体事实，避免用“你就应该”开头。','挑一个曾经因角色期待产生的小分歧，重新协商规则，并约好一周后复盘。'],avoid:'不要把“向来如此”“家里就是这样”当成无需讨论的理由。',prompt:'我们目前有哪些分工，是因为真正愿意，而不是因为不好意思拒绝？'},
 '冲突型':{summary:'部分关系领域较难形成双方都满意的积极一致，这可能代表你们面对同一问题时有不同的体验。分歧本身不等于关系失败。',focus:'先减少争执带来的伤害，再解决最反复的具体问题。',steps:['制定争执暂停规则：任何一方情绪过载都可以暂停20–30分钟，并明确约定何时回来继续谈。','每次只讨论一个具体事件，采用“发生了什么—我的感受—我的需要—我希望的一个可执行改变”四步表达。','在对方发言后先复述“我听到你在意的是……”，让对方确认理解无误，再提出自己的看法。','选择一个反复争执的主题，约定未来7天只试行一个小改变，复盘效果而不是翻旧账。'],avoid:'避免辱骂、威胁、冷暴力惩罚、翻旧账或把低分当作指责对方的证据。',prompt:'最近一次冲突中，我们各自最想被理解的是什么？下次怎样更早发现情绪正在升级？'},
 '失活型':{summary:'多个领域的积极一致度较低，可能意味着关系中的疲惫或长期未被回应的需要值得认真对待。单次自制问卷不能判断原因或未来。',focus:'先确认彼此是否愿意修复，以及什么会让沟通重新变得安全。',steps:['先各自写下一个仍希望保留的关系部分，以及一个最迫切希望改变的现实问题。','将讨论缩小到15–20分钟、一次一个主题；若无法平静交谈，可先用书面方式整理观点。','明确双方愿意尝试的最小行动，并设定两周后共同检查是否改善。','若持续僵持、失去信任或对话经常失控，可以考虑寻找合适的伴侣咨询师协助；双方自愿参与更重要。'],avoid:'不要凭一次分类就认定“没救了”，也不要强迫对方立即作出重大的关系决定。',prompt:'在什么具体改变发生之后，你会觉得这段关系值得继续投入？'}
};
const DOMAIN_GUIDES={
 '沟通':{why:'两个人对“有没有被听见、能否坦诚表达”的体验可能不同。',act:'轮流讲述一件最近的小事，每人两分钟，另一人只复述和确认，不急着解释或反驳。',ask:'当我表达情绪时，你希望我先听、先安慰，还是一起找办法？'},
 '冲突解决':{why:'争执后的修复、道歉或共同寻找方案可能需要更清晰的规则。',act:'一起约定暂停争论的暗号、恢复讨论的时间，以及不使用的人身攻击式表达。',ask:'上一次争执结束后，什么事情仍没有真正解决？'},
 '性格与生活习惯':{why:'生活节奏、个人空间或对彼此习惯的期待可能有摩擦。',act:'各自选一个最影响生活的习惯，提出可接受的底线和可妥协范围。',ask:'哪些习惯你能接受不同，哪些会明显影响长期生活？'},
 '财务管理':{why:'消费、储蓄或财务透明度可能存在不同预期。',act:'列出固定开销、个人可支配额度与大额支出协商门槛，不强求所有收入合并。',ask:'哪些支出必须共同决定？哪些保留各自自主权？'},
 '休闲活动':{why:'共同时间与独处、社交之间的平衡可能没有协调好。',act:'为下个月各安排一次共同活动和一次个人活动，事先谈好时间与预算。',ask:'怎样的相处时间会让你真正感到被陪伴？'},
 '亲密关系':{why:'表达爱与身体亲密的需要、界限可能不完全相同。',act:'分别说出一种喜欢的亲近方式和一种不愿接受的方式；任何身体接触都尊重当下同意。',ask:'什么时候你会最明显地感到被爱和被尊重？'},
 '家庭与朋友':{why:'亲友介入、节日安排或家庭边界可能造成压力。',act:'提前讨论下一次家庭聚会的计划与应对边界，避免临时让某一方独自承担。',ask:'当亲友的期待与我们的决定不一致，你希望我们如何配合？'},
 '关系角色与责任':{why:'家务、决策或情绪劳动的分配可能让一方觉得不公平。',act:'写出一周实际承担的任务和隐形协调工作，重新分配一项最不平衡的任务。',ask:'你现在承担的哪件事，最希望得到理解或支持？'},
 '价值观与信念':{why:'长远规划或关键价值取舍可能存在尚未谈明的差异。',act:'分别写下未来三年最重要的三个目标，标注可协商与不可协商的部分。',ask:'我们最想共同实现什么？遇到不同选择时依据什么原则决定？'}
};
function adviceMarkup(type,sorted,couple){
 if(!couple)return `<section class="card"><h2>下一步怎么做</h2><p>这份个人报告适合帮助你整理自己的感受；伴侣完成后，才能根据双方答案生成类型解读和共同建议。</p><p class="small muted">你可以先选一个个人得分较低的话题，写下具体例子与希望沟通的事情。</p></section>`;
 const g=TYPE_GUIDES[type],top=sorted.slice(0,3);
 return `<section class="card advice-section"><div class="eyebrow">PERSONALIZED GUIDANCE · 双人关系建议</div><h2 style="margin-top:10px">${safe(type)}：你们可以从这里开始</h2><p>${safe(g.summary)}</p><div class="advice-emphasis"><b>当前重点</b><p>${safe(g.focus)}</p></div><h3>推荐尝试的具体行动</h3><ol class="advice-list">${g.steps.map(t=>`<li>${safe(t)}</li>`).join('')}</ol><p class="small muted"><b>注意避免：</b>${safe(g.avoid)}</p><div class="advice-question"><b>可以一起聊的一个问题</b><p>${safe(g.prompt)}</p></div></section><section class="card advice-section"><div class="eyebrow">BASED ON YOUR ANSWERS · 根据本次得分</div><h2 style="margin-top:10px">优先改善的三个领域</h2><p class="small muted">按本次模拟积极一致度从低到高排序；相同分数时顺序不代表问题严重程度。</p>${top.map((x,i)=>{const g=DOMAIN_GUIDES[x.name];return `<article class="advice-domain"><div class="barhead"><span>${i+1}. ${safe(x.name)}</span><span class="tag">积极一致度 ${x.pca}/100</span></div><p>${safe(g.why)}</p><p><b>本周小练习：</b>${safe(g.act)}</p><p class="small muted"><b>讨论问题：</b>${safe(g.ask)}</p></article>`}).join('')}<div class="notice">分数低不代表某一方“有问题”。请把结果当成共同探索的线索，而不是给对方贴标签。若存在恐吓、控制或伤害，优先考虑个人安全和外部支持，不建议直接套用普通双人沟通练习。</div></section>`
}
const descriptions={'活力型':'大多数核心关系维度存在较高积极一致度，通常在沟通与冲突修复上也表现较好。','和谐型':'多方面有较好的积极一致，但仍存在需要商量和经营的主题。','传统型':'部分家庭角色或价值观维度较稳定，沟通与冲突解决方面可能是需要进一步提升的部分。','冲突型':'若干维度的积极一致度偏低，适合优先讨论反复出现的分歧和相互感受。','失活型':'多数核心领域的积极一致较少，可能需要更多支持来理解关系中长期存在的问题。'};
function result(){const couple=s.mode==='couple',pcs=DOMAIN.map((_,i)=>couple?pca(i):individual(0,i)),type=couple?classify(pcs):null,mean=Math.round(avg(pcs)),strength=pcs.filter(v=>v>=60).length,growth=pcs.filter(v=>v<=20).length;let sorted=DOMAIN.map((d,i)=>({name:d[0],i,pca:pcs[i]})).sort((a,b)=>a.pca-b.pca);let diff=[];if(couple){DOMAIN.forEach((d,i)=>d[2].forEach((q,j)=>{let a=norm(i,j,0),b=norm(i,j,1);diff.push({q,domain:d[0],gap:Math.abs(a-b),a:s.answers[0][`${i}-${j}`],b:s.answers[1][`${i}-${j}`],bothLow:a<=2&&b<=2})}));diff.sort((a,b)=>b.gap-a.gap)}let ideal=individual(0,10),ideal2=couple?individual(1,10):null;
root.innerHTML=`<div class="eyebrow">RELATIONSHIP REPORT · 测评报告</div><h1>${couple?'你们的关系图谱':'你的关系感受'}</h1><p class="muted">${s.stage==='married'?'婚后 ENRICH 五型框架':'婚前 PREPARE 四型框架'} · ${couple?'双方都已完成 · 双人积极一致度模拟':'第一人已完成 · 等待第二人补测'} · 每人55题</p>${couple?`<section class="type"><div class="eyebrow">模拟关系类型 · 非官方判定</div><h2>${type} · ${({'活力型':'Vitalized','和谐型':'Harmonious','传统型':'Conventional','冲突型':'Conflicted','失活型':'Devitalized'})[type]}</h2><p>${descriptions[type]}</p><p style="font-size:12px;opacity:.8;margin-top:17px">这是原创题目的启发式分类，不等同于节目/官方系统结果；接近分类边界时尤其不稳定。</p></section>`:`<div class="notice"><b>第一人的个人报告已完成。</b> 单人不能判定共同关系类型。你可以让第二个人现在或以后接着完成55题，合并后会显示婚前四型／婚后五型的模拟关系类型。</div><div class="card"><h2>合并两个人的结果</h2><p>第一人的答案已保存在此浏览器。第二人独立作答后，会自动对比双方答案，并在报告最上方给出关系类型结果。</p><label class="field">第二个人的称呼<input id="partnerName" maxlength="16" value="${safe(s.names[1])}" placeholder="乙方"></label>${btn('让第二个人开始作答 →','startPartnerFromReport()')}</div>`}<div class="metric"><div class="stat"><strong>${mean}<small> /100</small></strong><small>${couple?'九个领域平均积极一致度':'九个领域平均个人得分'}</small></div><div class="stat"><strong>${strength}</strong><small>${couple?'积极一致度 ≥60 的领域':'个人得分 ≥60 的领域'}</small></div><div class="stat"><strong>${growth}</strong><small>${couple?'积极一致度 ≤20 的领域':'个人得分 ≤20 的领域'}</small></div></div><section class="card"><h2>九个核心关系维度</h2><p class="small muted">${couple?'绿色表示双方在健康方向同时认同的题目比例（0、20、40、60、80、100），不是个人满意度平均。':'绿色表示你对这一维度的主观评价标准化分数。'}</p>${DOMAIN.map((d,i)=>`<div class="barrow"><div class="barhead"><span>${safe(d[0])}</span><span>${pcs[i]} / 100</span></div><div class="track"><div class="fill" style="width:${pcs[i]}%"></div></div>${couple?`<div class="small muted">${safe(s.names[0])} 个人得分 ${individual(0,i)} · ${safe(s.names[1])} 个人得分 ${individual(1,i)}</div>`:''}</div>`).join('')}</section><section class="card"><h2>关系优势与成长领域</h2><p class="small muted">根据本次自制问卷排序，不代表官方标准。</p><h3>最值得优先聊的三个领域</h3>${sorted.slice(0,3).map(x=>`<div class="diff"><b>${safe(x.name)}</b> <span class="tag">${x.pca}/100</span><p class="small muted" style="margin-top:5px">${couple?'双方积极一致的题目相对较少':'你的主观得分相对较低'}。建议分别举一个真实生活中的例子，再讨论希望对方怎样回应。</p></div>`).join('')}<h3 style="margin-top:24px">目前相对顺畅的领域</h3><p>${sorted.slice(-3).reverse().map(x=>`${x.name}（${x.pca}）`).join('、')}</p></section>${adviceMarkup(type,sorted,couple)}${couple?`<section class="card"><h2>双方感受差异最大的题目</h2>${diff.filter(d=>d.gap>=2).slice(0,8).map(d=>`<div class="diff"><div class="small muted">${safe(d.domain)}</div><b>${safe(d.q)}</b><div class="answers"><span class="blue">${safe(s.names[0])}：${LABELS[d.a-1]}</span><span class="orange">${safe(s.names[1])}：${LABELS[d.b-1]}</span></div></div>`).join('')||'<p class="muted">没有出现差异达到两档以上的题目。</p>'}</section><section class="card"><h2>双方都觉得困难的题目</h2>${diff.filter(d=>d.bothLow).slice(0,6).map(d=>`<div class="diff"><div class="small muted">${safe(d.domain)}</div><b>${safe(d.q)}</b><div class="answers"><span class="blue">${safe(s.names[0])}：${LABELS[d.a-1]}</span><span class="orange">${safe(s.names[1])}：${LABELS[d.b-1]}</span></div></div>`).join('')||'<p class="muted">未发现两位都明确评价为不理想的条目。</p>'}</section>`:''}<section class="card"><h2>整体感受与理想化提醒</h2><p>${safe(s.names[0])}的整体关系感受：${individual(0,9)}/100；理想化条目均值：${(1+ideal*4/100).toFixed(1)}/5。</p>${couple?`<p>${safe(s.names[1])}的整体关系感受：${individual(1,9)}/100；理想化条目均值：${(1+ideal2*4/100).toFixed(1)}/5。</p>`:''}<p class="small muted">理想化题的高分提示可能存在较绝对的关系期待，不能据此判断是否说谎。整体感受题与理想化题不参与上述类型分类。</p></section><section class="card"><h2>怎么算出来的？</h2><p>每人回答五级量表，核心九维每维5道题。每个领域的模拟积极一致度 PCA = 该领域中双方都给出积极回答的题目数 ÷ 5 × 100%。反向题先反向计分。</p><p>关系类型使用依据公开研究趋势设计的启发式规则，参考积极一致度整体水平及沟通、冲突、角色与价值观的相对形态。<b>它不是官方分类算法，也没有完成信效度验证。</b>正式的类型结果需要两人使用官方问卷，由经过培训的专业人员进行解读。</p><p class="small muted">参考：Olson & Fowers (1993)；PREPARE/ENRICH Scientific Foundation。历史版本、题目组合及节目制作方式可能不同。</p></section><div class="actions">${btn('保存报告为 PDF','window.print()',true)}${btn('导出报告文字','exportText()',true)}${btn('重新测评','if(confirm("确定清空当前答案吗？")){s={stage:s.stage,mode:"couple",names:["甲方","乙方"],person:0,page:0,answers:[{},{}],screen:"intro"};render();scrollTop()}')}</div>`;s._result={type,pcs,mean,sorted,couple}}
function startPartnerFromReport(){const el=document.getElementById('partnerName');if(el)s.names[1]=el.value.trim()||'乙方';addPartner()}function exportText(){let r=s._result;let lines=['亲密关系图谱（非官方 PREPARE/ENRICH 框架模拟）',`阶段：${s.stage==='married'?'已婚':'婚前'}`,`模式：${r.couple?'双人':'单人'}`,`关系类型参考：${r.type||'单人不分类'}`,`平均分：${r.mean}/100`,''];DOMAIN.forEach((d,i)=>lines.push(`${d[0]}：${r.pcs[i]}/100`));if(r.couple&&TYPE_GUIDES[r.type]){let g=TYPE_GUIDES[r.type];lines.push('','【关系类型解读】',g.summary,'当前重点：'+g.focus,'【行动建议】',...g.steps.map((x,i)=>(i+1)+'. '+x),'注意避免：'+g.avoid,'共同讨论：'+g.prompt,'','【本次得分较低的三个领域】');r.sorted.slice(0,3).forEach((x,i)=>{let d=DOMAIN_GUIDES[x.name];lines.push((i+1)+'. '+x.name+'（'+x.pca+'/100）','提示：'+d.why,'建议：'+d.act,'讨论：'+d.ask)});}lines.push('','本报告基于原创题目与启发式规则，不是官方 ENRICH 结果。');let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='亲密关系测评报告.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}restore();render();
</script></body></html>
